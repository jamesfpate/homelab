# Clock (Ulanzi TC002, official AWTRIX NG 1.2+, MQTT prefix "clock"). HA pushes apps every minute: "morning", one
# non-scrolling two-row screen (top: weather icon, coloured temperature and condition, 7:30-9:00; bottom: next two
# catchable Q (7:45-9:00) and F (8:15-9:00) trains, fed by the mta-trains containers, skipping trains under the 10 min
# walk), and what the living room receiver or TV is playing. Time is the clock's built-in app. Order/disable of apps is
# set once on the clock (PUT /api/v1/apps/order); pushed apps are removed by publishing an empty payload.
mqtt:
  sensor:
    - name: "Q Beverley Rd to Manhattan"
      unique_id: q_beverley_manhattan
      state_topic: transit/beverley_q_manhattan
      value_template: "{{ value_json.minutes[0] if value_json.minutes else 'none' }}"
      json_attributes_topic: transit/beverley_q_manhattan
      availability_topic: transit/beverley_q_manhattan/status
      icon: mdi:subway-variant
    - name: "F Church Av to Manhattan"
      unique_id: f_church_manhattan
      state_topic: transit/church_f_north
      value_template: "{{ value_json.minutes[0] if value_json.minutes else 'none' }}"
      json_attributes_topic: transit/church_f_north
      availability_topic: transit/church_f_north/status
      icon: mdi:subway-variant

template:
  - sensor:
      - name: "Now playing"
        unique_id: now_playing_any_speaker
        icon: mdi:music-note
        state: >-
          {% set ns = namespace(t='') %}
          {# living room receiver only (Onkyo via Music Assistant, and direct) #}
          {% for p in ['media_player.receiver_2', 'media_player.tx_nr7100'] %}
            {% if ns.t == '' and is_state(p, 'playing') and state_attr(p, 'media_title') %}
              {% set artist = state_attr(p, 'media_artist') %}
              {% set ns.t = (artist ~ ' - ' if artist else '') ~ state_attr(p, 'media_title') %}
            {% endif %}
          {% endfor %}
          {{ ns.t[:120] if ns.t else 'nothing' }}

automation:
  - alias: "Clock: knob and buttons control the TV while it is on"
    id: clock_tv_controls
    mode: queued
    triggers:
      - trigger: state
        entity_id: event.clock_knob
        id: knob
      - trigger: state
        entity_id: binary_sensor.clock_button_right
        to: "on"
        id: plus
      - trigger: state
        entity_id: binary_sensor.clock_button_left
        to: "on"
        id: minus
      - trigger: state
        entity_id: binary_sensor.clock_button_select
        to: "on"
        id: select
    conditions:
      - condition: state
        entity_id: media_player.living_room_tv
        state: "on"
    actions:
      - variables:
          turn: "{{ state_attr('event.clock_knob', 'event_type') }}"
      - choose:
          - conditions: "{{ trigger.id == 'plus' or (trigger.id == 'knob' and turn == 'clockwise') }}"
            sequence:
              - action: media_player.volume_up
                target:
                  entity_id: media_player.living_room_tv
          - conditions: "{{ trigger.id == 'minus' or (trigger.id == 'knob' and turn == 'counterclockwise') }}"
            sequence:
              - action: media_player.volume_down
                target:
                  entity_id: media_player.living_room_tv
          - conditions: "{{ trigger.id == 'select' }}"
            sequence:
              - action: media_player.volume_mute
                target:
                  entity_id: media_player.living_room_tv
                data:
                  is_volume_muted: "{{ not state_attr('media_player.living_room_tv', 'is_volume_muted') }}"

  - alias: "Clock: stop the knob switching apps while the TV is on"
    id: clock_block_navigation
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.living_room_tv
    actions:
      - action: mqtt.publish
        data:
          topic: clock/cmd/settings
          payload: '{{ {"blockNavigation": is_state("media_player.living_room_tv", "on")} | to_json }}'

  - alias: "Clock: push apps"
    id: clock_push_apps
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: sensor.now_playing
      - trigger: state
        entity_id: sensor.q_beverley_rd_to_manhattan
      - trigger: state
        entity_id: sensor.f_church_av_to_manhattan
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: fc
      - variables:
          today: "{{ ((fc['weather.forecast_home'] | default({}, true)).forecast | default([], true))[0] | default({}, true) }}"
          temp: "{{ state_attr('weather.forecast_home', 'temperature') | round(0) | int }}"
          words: >-
            {% set c = states('weather.forecast_home') %}
            {% set m = {'sunny': 'Sunny', 'clear-night': 'Clear', 'partlycloudy': 'Partly', 'cloudy': 'Cloudy',
                        'fog': 'Fog', 'rainy': 'Rain', 'pouring': 'Pouring', 'lightning': 'Storms', 'lightning-rainy': 'Storms',
                        'snowy': 'Snow', 'snowy-rainy': 'Sleet', 'hail': 'Hail', 'windy': 'Windy', 'windy-variant': 'Windy'} %}
            {{ m.get(c, c | replace('-', ' ') | title) }}
          rain_today: >-
            {{ today.condition | default('') in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']
               or (today.precipitation | default(0) | float(0)) > 0.05 }}
          temp_color: >-
            {% if temp > 80 %}#FF3B30{% elif temp > 75 %}#FFD60A{% elif temp > 65 %}#34C759{% elif temp < 60 %}#4DA3FF{% else %}#FFFFFF{% endif %}
          words_color: >-
            {% set c = states('weather.forecast_home') %}
            {% set m = {'sunny': '#FFD60A', 'clear-night': '#4DA3FF', 'partlycloudy': '#B0C4DE', 'cloudy': '#9E9E9E', 'fog': '#9E9E9E',
                        'rainy': '#1E90FF', 'pouring': '#0057D9', 'lightning': '#C77DFF', 'lightning-rainy': '#C77DFF',
                        'snowy': '#FFFFFF', 'snowy-rainy': '#D8EEFF', 'hail': '#D8EEFF', 'windy': '#7FDBFF', 'windy-variant': '#7FDBFF'} %}
            {{ m.get(c, '#FFFFFF') }}
          wx_icon: >-
            {% set c = states('weather.forecast_home') %}
            {% set m = {'sunny': 'wx_sun', 'clear-night': 'wx_clearnight', 'partlycloudy': 'wx_partly', 'cloudy': 'wx_cloud', 'fog': 'wx_fog',
                        'rainy': 'wx_rain', 'pouring': 'wx_pouring', 'lightning': 'wx_storm', 'lightning-rainy': 'wx_storm',
                        'snowy': 'wx_snow', 'snowy-rainy': 'wx_snow', 'hail': 'wx_snow', 'windy': 'wx_cloud', 'windy-variant': 'wx_cloud'} %}
            {{ m.get(c, 'wx_cloud') }}
          weather_text:
            - text: "{{ temp }}° "
              color: "{{ temp_color }}"
            # rain later today replaces the condition (the icon still shows the current one)
            - text: "{{ 'Rain' if rain_today and words not in ['Rain', 'Pouring', 'Storms'] else words }}"
              color: "{{ '#1E90FF' if rain_today and words not in ['Rain', 'Pouring', 'Storms'] else words_color }}"
          q_next: >-
            {% set t = (state_attr('sensor.q_beverley_rd_to_manhattan', 'times') or []) | map('as_timestamp', none) | select('number') | list %}
            {% set ns = namespace(m=[]) %}{% for ts in t %}{% set mins = ((ts - now().timestamp()) / 60) | round(0) | int %}{% if mins > 10 %}{% set ns.m = ns.m + [mins] %}{% endif %}{% endfor %}
            {{ 'N/A' if ns.m | count == 0 else (ns.m[:2] | map('string') | join(' ')) }}
          f_next: >-
            {% set t = (state_attr('sensor.f_church_av_to_manhattan', 'times') or []) | map('as_timestamp', none) | select('number') | list %}
            {% set ns = namespace(m=[]) %}{% for ts in t %}{% set mins = ((ts - now().timestamp()) / 60) | round(0) | int %}{% if mins > 10 %}{% set ns.m = ns.m + [mins] %}{% endif %}{% endfor %}
            {{ 'N/A' if ns.m | count == 0 else (ns.m[:2] | map('string') | join(' ')) }}
          playing: "{{ states('sensor.now_playing') }}"
          # show windows (local time, every day): weather 7:30-9:00, Q 7:45-9:00, F 8:15-9:00
          hm: "{{ now().hour * 60 + now().minute }}"
          show_wx: "{{ 7*60+30 <= hm < 9*60 }}"
          show_q: "{{ 7*60+45 <= hm < 9*60 }}"
          show_f: "{{ 8*60+15 <= hm < 9*60 }}"
          tv_playing: >-
            {# Plex client on the living room TV only (entity appears after the first play; name comes from the Plex client) #}
            {% set plex = states.media_player | selectattr('entity_id', 'search', 'plex') | selectattr('entity_id', 'search', 'tv|lg|living') | selectattr('state', 'eq', 'playing') | list %}
            {# the LG integration itself never reports video titles (YouTube etc), only live-TV channel names, so Plex is the only source #}
            {% if plex | count > 0 and plex[0].attributes.media_title %}
              {% set p = plex[0].attributes %}{{ 'TV: ' ~ (p.media_series_title ~ ' - ' if p.media_series_title else '') ~ p.media_title }}
            {% endif %}
      - variables:
          # one layout app, regions only for what is in its window; the weather sits mid-height while no trains show
          morning: >-
            {% set trains = show_q or show_f %}{% set y = 0 if trains else 4 %}
            {% set ns = namespace(r=[]) %}
            {% if show_wx %}
              {% set ns.r = ns.r + [{"id": "wxicon", "box": [0, y, 8, 8], "icon": wx_icon},
                                    {"id": "wx", "box": [9, y, 43, 8], "font": "small", "align": "start", "text": weather_text}] %}
            {% endif %}
            {% if show_q %}{% set ns.r = ns.r + [{"id": "q", "box": [1, 8, 25, 8], "font": "small", "align": "start", "text": "Q " ~ q_next, "color": "#FCCC0A"}] %}{% endif %}
            {% if show_f %}{% set ns.r = ns.r + [{"id": "f", "box": [27, 8, 25, 8], "font": "small", "align": "start", "text": "F " ~ f_next, "color": "#FF6319"}] %}{% endif %}
            {{ {"layout": {"version": 1, "regions": ns.r}, "durationMs": 10000, "lifetimeMs": 300000} if ns.r else "" }}
      - action: mqtt.publish
        data:
          topic: clock/cmd/apps/pushed/morning
          payload: '{{ (morning | to_json) if morning else "" }}'
      - variables:
          show: "{{ playing if playing not in ['nothing', 'unknown', 'unavailable'] else (tv_playing | trim) }}"
      - if: "{{ show | trim != '' }}"
        then:
          - action: mqtt.publish
            data:
              topic: clock/cmd/apps/pushed/nowplaying
              payload: '{{ {"text": show | trim, "repeat": 1, "durationMs": 10000, "lifetimeMs": 180000} | to_json }}'
        else:
          - action: mqtt.publish
            data:
              topic: clock/cmd/apps/pushed/nowplaying
              payload: ""
