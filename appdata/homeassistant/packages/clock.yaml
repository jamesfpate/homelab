# Clock (Ulanzi TC002, official AWTRIX NG 1.2+, MQTT prefix "clock"). The screen is one layout app, "main", pushed by HA
# every minute: time, weather icon and coloured temperature fixed on the top row; the next catchable Q (7:45-9:00) and F
# (8:15-9:00) trains (fed by the mta-trains containers, skipping trains under the 10 min walk), rain later today and what
# the living room receiver or TV is playing scroll along the bottom row. App order is main, then the built-in Time app as
# the fallback when HA stops pushing (set once with clock/cmd/apps/order).
mqtt:
  sensor:
    - name: "Q Beverley Rd to Manhattan"
      unique_id: q_beverley_manhattan
      state_topic: transit/beverley_q_manhattan
      value_template: "{{ value_json.minutes[0] if value_json.minutes else 'none' }}"
      json_attributes_topic: transit/beverley_q_manhattan
      availability_topic: transit/beverley_q_manhattan/status
      icon: mdi:subway-variant
    - name: "F Church Av to Manhattan"
      unique_id: f_church_manhattan
      state_topic: transit/church_f_north
      value_template: "{{ value_json.minutes[0] if value_json.minutes else 'none' }}"
      json_attributes_topic: transit/church_f_north
      availability_topic: transit/church_f_north/status
      icon: mdi:subway-variant

template:
  - sensor:
      - name: "Now playing"
        unique_id: now_playing_any_speaker
        icon: mdi:music-note
        state: >-
          {% set ns = namespace(t='') %}
          {# living room receiver only (Onkyo via Music Assistant, and direct) #}
          {% for p in ['media_player.receiver_2', 'media_player.tx_nr7100'] %}
            {% if ns.t == '' and is_state(p, 'playing') and state_attr(p, 'media_title') %}
              {% set artist = state_attr(p, 'media_artist') %}
              {% set ns.t = (artist ~ ' - ' if artist else '') ~ state_attr(p, 'media_title') %}
            {% endif %}
          {% endfor %}
          {{ ns.t[:120] if ns.t else 'nothing' }}

      # Plex client on the living room TV only (the entity appears after the first play; its name comes from the Plex
      # client). The LG integration never reports video titles (YouTube etc), only live-TV channel names, so Plex is the
      # only source.
      - name: "TV now playing"
        unique_id: tv_now_playing_living_room
        icon: mdi:television-play
        state: >-
          {% set plex = states.media_player | selectattr('entity_id', 'search', 'plex') | selectattr('entity_id', 'search', 'tv|lg|living') | selectattr('state', 'eq', 'playing') | list %}
          {% if plex | count > 0 and plex[0].attributes.media_title %}
            {% set p = plex[0].attributes %}{{ ('TV: ' ~ (p.media_series_title ~ ' - ' if p.media_series_title else '') ~ p.media_title)[:250] }}
          {% else %}nothing{% endif %}

automation:
  # Knob turns the receiver volume, knob press toggles the receiver, plus/minus set the screen brightness.
  - alias: "Clock: knob controls the receiver, buttons set brightness"
    id: clock_tv_controls
    mode: queued
    triggers:
      - trigger: state
        entity_id: event.clock_knob
        id: knob
      - trigger: state
        entity_id: binary_sensor.clock_knob
        to: "on"
        id: press
      - trigger: state
        entity_id: binary_sensor.clock_button_right
        to: "on"
        id: plus
      - trigger: state
        entity_id: binary_sensor.clock_button_left
        to: "on"
        id: minus
    actions:
      - variables:
          turn: "{{ state_attr('event.clock_knob', 'event_type') }}"
          receiver_on: "{{ states('media_player.tx_nr7100') not in ['off', 'unavailable', 'unknown'] }}"
          bri: "{{ state_attr('light.clock_matrix', 'brightness') | int(128) }}"
      - choose:
          - conditions: "{{ trigger.id == 'knob' and turn == 'clockwise' and receiver_on }}"
            sequence:
              - action: media_player.volume_up
                target:
                  entity_id: media_player.tx_nr7100
          - conditions: "{{ trigger.id == 'knob' and turn == 'counterclockwise' and receiver_on }}"
            sequence:
              - action: media_player.volume_down
                target:
                  entity_id: media_player.tx_nr7100
          - conditions: "{{ trigger.id == 'press' }}"
            sequence:
              - action: "media_player.turn_{{ 'off' if receiver_on else 'on' }}"
                target:
                  entity_id: media_player.tx_nr7100
          - conditions: "{{ trigger.id in ['plus', 'minus'] }}"
            sequence:
              - action: light.turn_on # never steps to 0, which would turn the screen off
                target:
                  entity_id: light.clock_matrix
                data:
                  brightness: "{{ [[bri + (25 if trigger.id == 'plus' else -25), 5] | max, 255] | min }}"

  # The buttons and knob never switch apps ("main" is the only screen); HA handles them instead.
  - alias: "Clock: block button navigation"
    id: clock_block_navigation
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.clock_button_select
        from: unavailable
    actions:
      - action: mqtt.publish
        data:
          topic: clock/cmd/settings
          payload: '{"blockNavigation": true}'

  - alias: "Clock: push apps"
    id: clock_push_apps
    mode: queued # train sensors update every 30 s, often while the previous push is still running
    max: 3
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: sensor.now_playing
      - trigger: state
        entity_id: sensor.q_beverley_rd_to_manhattan
      - trigger: state
        entity_id: sensor.f_church_av_to_manhattan
      - trigger: state
        entity_id: sensor.tv_now_playing
        not_from: [unknown, unavailable] # no replay of the current title on every HA restart
        id: tv
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: fc
      - variables:
          today: "{{ ((fc['weather.forecast_home'] | default({}, true)).forecast | default([], true))[0] | default({}, true) }}"
          temp: "{{ state_attr('weather.forecast_home', 'temperature') | round(0) | int }}"
          words: >-
            {% set c = states('weather.forecast_home') %}
            {% set m = {'sunny': 'Sunny', 'clear-night': 'Clear', 'partlycloudy': 'Partly', 'cloudy': 'Cloudy',
                        'fog': 'Fog', 'rainy': 'Rain', 'pouring': 'Pouring', 'lightning': 'Storms', 'lightning-rainy': 'Storms',
                        'snowy': 'Snow', 'snowy-rainy': 'Sleet', 'hail': 'Hail', 'windy': 'Windy', 'windy-variant': 'Windy'} %}
            {{ m.get(c, c | replace('-', ' ') | title) }}
          rain_today: >-
            {{ today.condition | default('') in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']
               or (today.precipitation | default(0) | float(0)) > 0.05 }}
          temp_color: >-
            {% if temp > 80 %}#FF3B30{% elif temp > 75 %}#FFD60A{% elif temp > 65 %}#34C759{% elif temp < 60 %}#4DA3FF{% else %}#FFFFFF{% endif %}
          wx_icon: >-
            {% set c = states('weather.forecast_home') %}
            {% set m = {'sunny': 'wx_sun', 'clear-night': 'wx_clearnight', 'partlycloudy': 'wx_partly', 'cloudy': 'wx_cloud', 'fog': 'wx_fog',
                        'rainy': 'wx_rain', 'pouring': 'wx_pouring', 'lightning': 'wx_storm', 'lightning-rainy': 'wx_storm',
                        'snowy': 'wx_snow', 'snowy-rainy': 'wx_snow', 'hail': 'wx_snow', 'windy': 'wx_cloud', 'windy-variant': 'wx_cloud'} %}
            {{ m.get(c, 'wx_cloud') }}
          q_next: >-
            {% set t = (state_attr('sensor.q_beverley_rd_to_manhattan', 'times') or []) | map('as_timestamp', none) | select('number') | list %}
            {% set ns = namespace(m=[]) %}{% for ts in t %}{% set mins = ((ts - now().timestamp()) / 60) | round(0) | int %}{% if mins > 10 %}{% set ns.m = ns.m + [mins] %}{% endif %}{% endfor %}
            {{ 'N/A' if ns.m | count == 0 else (ns.m[:2] | map('string') | join(' ')) }}
          f_next: >-
            {% set t = (state_attr('sensor.f_church_av_to_manhattan', 'times') or []) | map('as_timestamp', none) | select('number') | list %}
            {% set ns = namespace(m=[]) %}{% for ts in t %}{% set mins = ((ts - now().timestamp()) / 60) | round(0) | int %}{% if mins > 10 %}{% set ns.m = ns.m + [mins] %}{% endif %}{% endfor %}
            {{ 'N/A' if ns.m | count == 0 else (ns.m[:2] | map('string') | join(' ')) }}
          playing: "{{ states('sensor.now_playing') }}"
          # train windows (local time, every day): Q 7:45-9:00, F 8:15-9:00
          hm: "{{ now().hour * 60 + now().minute }}"
          show_q: "{{ 7*60+45 <= hm < 9*60 }}"
          show_f: "{{ 8*60+15 <= hm < 9*60 }}"
      - variables:
          # The whole screen is one layout app: time, weather icon and temperature fixed on the top row; trains (in their
          # windows), rain later today and music on the receiver scroll along the bottom row, or today's date when there is
          # nothing. A new TV title is shown once, as a notification with the same top row, instead of staying on.
          # HA owns the time, so the app is pushed every minute with a 3 min lifetime: if HA stops, it expires and the
          # clock falls back to its built-in Time app.
          show: "{{ playing if playing not in ['nothing', 'unknown', 'unavailable'] else '' }}"
          tv_title: "{{ states('sensor.tv_now_playing') }}"
          top:
            - {"id": "time", "box": [0, 0, 22, 8], "font": "small", "align": "start", "text": "{{ now().strftime('%-I:%M') }}"}
            - {"id": "wxicon", "box": [24, 0, 8, 8], "icon": "{{ wx_icon }}"}
            - {"id": "temp", "box": [33, 0, 19, 8], "font": "small", "align": "end", "text": [{"text": "{{ temp }}°", "color": "{{ temp_color }}"}]}
          rain_later: "{{ rain_today and words not in ['Rain', 'Pouring', 'Storms'] }}"
          main: >-
            {% set ns = namespace(b=[]) %}
            {% if show_q %}{% set ns.b = ns.b + [{"text": "Q " ~ q_next, "color": "#FCCC0A"}] %}{% endif %}
            {% if show_f %}{% set ns.b = ns.b + [{"text": "F " ~ f_next, "color": "#FF6319"}] %}{% endif %}
            {% if rain_later %}{% set ns.b = ns.b + [{"text": "Rain today", "color": "#1E90FF"}] %}{% endif %}
            {% if show | trim %}{% set ns.b = ns.b + [{"text": show | trim, "color": "#FFFFFF"}] %}{% endif %}
            {% set ns.out = [] %}
            {% for item in ns.b %}{% set ns.out = ns.out + [{"text": ("   " if not loop.first else "") ~ item.text, "color": item.color}] %}{% endfor %}
            {% set bottom = ns.out if ns.out else [{"text": now().strftime('%a %b ') ~ now().day, "color": "#9E9E9E"}] %}
            {{ {"layout": {"version": 1, "regions": top + [
                 {"id": "bottom", "box": [0, 8, 52, 8], "font": "small", "align": "start",
                  "scroll": {"mode": "loop", "gap": 16, "speed": 60}, "text": bottom}]},
                "durationMs": 3600000, "lifetimeMs": 180000} }}
      - action: mqtt.publish
        data:
          topic: clock/cmd/apps/pushed/main
          payload: "{{ main | to_json }}"
      - if: "{{ trigger.id == 'tv' and tv_title not in ['nothing', 'unknown', 'unavailable', ''] }}"
        then:
          - action: mqtt.publish
            data:
              topic: clock/cmd/notify
              payload: >-
                {{ {"name": "tvtitle", "layout": {"version": 1, "regions": top + [
                     {"id": "bottom", "box": [0, 8, 52, 8], "font": "small", "align": "start", "repeat": 1,
                      "scroll": {"mode": "wrap", "entry": "offscreen", "speed": 60},
                      "text": [{"text": tv_title, "color": "#E5A00D"}]}]}} | to_json }}
