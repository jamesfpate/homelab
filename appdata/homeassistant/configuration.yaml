# Loads default set of integrations. Do not remove.
default_config:

# Feature bundles (YAML) that don't belong in the UI-managed files: packages/<name>.yaml
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Wake devices over the network (LG TV turn-on)
wake_on_lan:

# Reverse proxy trust is configured in the UI since HA 2026.8 (YAML removed in 2027.2):
# Settings > System > Network > HTTP server: Trust X-Forwarded-For on, Trusted proxies 192.168.1.2 (Traefik).
# On a fresh install, set this via http://192.168.1.40:8123 before using https://ha.<domain> (otherwise 400).
