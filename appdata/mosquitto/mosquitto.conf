# Mosquitto for Home Assistant + AWTRIX (Ulanzi clock). Copy to /mnt/user/appdata/mosquitto/config/mosquitto.conf.
# The password file is generated at container start from MQTT_USER/MQTT_PASS in the server .env (stacks/home.yaml).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
