# Bootstrap stack deployed by Unraid Compose Manager (stack name: komodo). Contains only Komodo,
# which then deploys everything in /stacks. Komodo can't safely redeploy itself, so this is the
# only stack updated by hand (Compose Manager -> Update Stack). Variables come from
# /mnt/user/appdata/env/.env.
#
# Based on https://github.com/moghtech/komodo/blob/main/compose/ferretdb.compose.yaml
#
# The VLAN macvlan networks are created once on the host by scripts/create-networks.sh
# and referenced as external everywhere.
#
# Unraid's /etc lives in RAM and is wiped on reboot, so everything Komodo needs to persist
# is kept under /mnt/user/appdata/komodo.
networks:
  komodo:
    name: komodo # Traefik (stacks/proxy.yaml) joins this to reach komodo-core

services:
  # FerretDB and its Postgres/DocumentDB image are pinned as a matched pair: upgrade them together,
  # deliberately, following FerretDB's release notes.
  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: komodo-postgres
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    logging:
      driver: local
    networks:
      - komodo
    volumes:
      - /mnt/user/appdata/komodo/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres

  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo-ferretdb
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on:
      - komodo-postgres
    logging:
      driver: local
    networks:
      - komodo
    volumes:
      ## FerretDB runs as uid 1000: before first start, chown 1000:1000 this folder
      ## or it crash-loops with "open /state/state.json: permission denied".
      - /mnt/user/appdata/komodo/ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@komodo-postgres:5432/postgres

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    init: true
    labels:
      komodo.skip:
      traefik.enable: "true"
      traefik.http.routers.komodo.rule: "Host(`komodo.${DOMAIN}`)"
      traefik.http.routers.komodo.entrypoints: "websecure"
      traefik.http.routers.komodo.middlewares: "ipallowlist"
      traefik.http.services.komodo.loadbalancer.server.port: "9120"
    restart: unless-stopped
    depends_on:
      - komodo-ferretdb
    logging:
      driver: local
    networks:
      - komodo
    ports:
      - 9120:9120 # fallback UI at http://<unraid-ip>:9120 if Traefik is down
    environment:
      TZ: ${TZ}
      KOMODO_DATABASE_ADDRESS: komodo-ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      KOMODO_HOST: https://komodo.${DOMAIN}
      KOMODO_TITLE: Komodo
      ## Periphery connects out to Core and authenticates with the generated key pair
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_FIRST_SERVER_NAME: Unraid
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_JWT_TTL: 1-wk
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
    volumes:
      - /mnt/user/appdata/komodo/keys:/config/keys
      - /mnt/user/appdata/komodo/backups:/backups

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    container_name: komodo-periphery
    init: true
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on:
      - komodo-core
    logging:
      driver: local
    networks:
      - komodo
    environment:
      TZ: ${TZ}
      PERIPHERY_CORE_ADDRESS: ws://komodo-core:9120
      PERIPHERY_CONNECT_AS: Unraid
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /mnt/user/appdata/komodo/periphery
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
    volumes:
      - /mnt/user/appdata/komodo/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      ## Root directory must be the same path inside and outside the container.
      - /mnt/user/appdata/komodo/periphery:/mnt/user/appdata/komodo/periphery
      ## Shared env file used by every stack (see additional_env_files in komodo/resources.toml)
      - /mnt/user/appdata/env:/mnt/user/appdata/env:ro
