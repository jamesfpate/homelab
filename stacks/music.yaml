networks:
  vlan-private:
    external: true
    name: br0
  vlan-iot:
    external: true
  vlan-downloads:
    external: true

# Music Assistant: Spotify (and other sources) -> Onkyo receiver, KEF LSX II, Satellite1.1 speakers.
# Must share a layer-2 network with its players for discovery/streaming (MA docs), so it lives on
# the IoT VLAN with them (macvlan = supported alternative to host networking).
# HA integration URL: http://192.168.40.45:8095. Web UI via Traefik (on vlan-iot): music.<domain>.
#
# Self-hosted music (see README "Music"): Navidrome serves /mnt/user/plexmedia/music.
# Phase 2 discovery services (musicflow) are live; see README "Phase 2".
# To turn them on, delete those profile lines (here and in media.yaml) and push.
services:
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    restart: unless-stopped
    networks:
      vlan-iot:
        ipv4_address: 192.168.40.45
    environment:
      - TZ=${TZ}
    volumes:
      - /mnt/user/appdata/music-assistant:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vlan-iot"
      - "traefik.http.routers.music.rule=Host(`music.${DOMAIN}`)"
      - "traefik.http.routers.music.entrypoints=websecure"
      - "traefik.http.routers.music.middlewares=ipallowlist"
      - "traefik.http.services.music.loadbalancer.server.port=8095"

  navidrome: # music server for Symfonium (Android), Feishin (Mac), Music Assistant
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks:
      vlan-private: # phones/Mac (LAN + UDM WireGuard) via Traefik
        ipv4_address: 192.168.1.14
      vlan-iot: # Music Assistant (IoT can't initiate into main)
        ipv4_address: 192.168.40.46
      vlan-downloads: # musicflow (VLAN 60 is isolated)
        ipv4_address: 192.168.60.14
    volumes:
      - /mnt/user/appdata/navidrome:/data
      - /mnt/user/plexmedia/music:/music
    environment:
      - TZ=${TZ}
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_PLAYLISTSPATH=playlists # .nsp smart playlists in /music/playlists
      - ND_SCANNER_SCHEDULE=@every 6h # file watcher handles most changes
      - ND_SCANNER_PURGEMISSING=always # drop deleted inbox tracks from the DB
      - ND_SUBSONIC_DEFAULTREPORTREALPATH=true # musicflow maps songs to files via the API
      - ND_LISTENBRAINZ_ENABLED=true # link per user in Navidrome > Personal
      - ND_LASTFM_ENABLED=true # scrobble to Last.fm too; link per user in Navidrome > Personal
      - ND_LASTFM_APIKEY=${LASTFM_API_KEY}
      - ND_LASTFM_SECRET=${LASTFM_SECRET}
      - ND_ENABLESTARRATING=true
      - ND_LOGLEVEL=info
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=br0"
      - "traefik.http.routers.navidrome.rule=Host(`listen.${DOMAIN}`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      # No ipallowlist: it only allows 192.168.1.0/24 and would block WireGuard clients.
      # Navidrome has its own auth and there is no public route.
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"

  musicflow: # Phase 2: keeps INBOX_SIZE unheard tracks in the inbox (Weekly Exploration, Fresh Releases, r/listentothis);
    # star=keep, rate 1=dislike, heard+unstarred=delete, unheard never deleted
    build: ../apps/musicflow
    image: musicflow:local
    pull_policy: build
    container_name: musicflow
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.71
      vlan-private:
        ipv4_address: 192.168.1.28 # reaches Ollama on br0 (VLANs are isolated)
    volumes:
      - /mnt/user/appdata/musicflow:/config # beets db, logs, state
      - /mnt/user/plexmedia/music:/music # same path Navidrome sees
      - /mnt/user/downloads/slskd:/slskd
    environment:
      - TZ=${TZ}
      - NAVIDROME_URL=http://192.168.60.14:4533
      - NAVIDROME_USER=${NAVIDROME_USER}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD}
      - LB_USER=${LISTENBRAINZ_USER}
      - LB_TOKEN=${LISTENBRAINZ_TOKEN}
      - SLSKD_URL=http://192.168.60.69:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - INBOX_SIZE=50 # unheard tracks kept in the inbox; refilled nightly, never exceeded
      - PLAYED_GRACE_HOURS=0 # played and not starred = not wanted: removed at the next 19:00 promote
      - HEARD_FEEDBACK=none # only an explicit 1-star rating is reported to ListenBrainz as a dislike
      - SUBREDDITS=listentothis,folk,indieheads,progmetal,doommetal,postrock,postpunk
      - REDDIT_WINDOWS=all,month,week # per sub: all-time top 100, then month, then week; seen posts are never re-offered (all-time is memes on genre subs, the LLM parser drops those)
      - OLLAMA_URL=http://192.168.1.52:11434 # local LLM: parses Reddit titles, scores candidates for taste
      - OLLAMA_MODEL=gemma4:26b-a4b-it-qat
      - LLM_FILTER=false # shadow: scores are logged and shown on the dashboard but don't change what is fetched
      - LIDARR_URL=http://192.168.60.68:8686 # album stars -> Lidarr every 30 min
      - LIDARR_API_KEY=${LIDARR_API_KEY}
      - DRY_RUN=false # live since 2026-10-01 after a checked manual ingest run

  musicflow-web: # dashboard: inbox by source, keep rate per source, activity (inbox.<domain>)
    image: nginx:alpine
    container_name: musicflow-web
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.27
    volumes:
      - /mnt/user/appdata/musicflow/www:/usr/share/nginx/html:ro # written by musicflow after each run
      - /mnt/user/appdata/musicflow/nginx.conf:/etc/nginx/conf.d/default.conf:ro # appdata/musicflow/nginx.conf
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=br0"
      - "traefik.http.routers.musicflow.rule=Host(`inbox.${DOMAIN}`)"
      - "traefik.http.routers.musicflow.entrypoints=websecure"
      - "traefik.http.routers.musicflow.middlewares=ipallowlist"
      - "traefik.http.services.musicflow.loadbalancer.server.port=80"
