networks:
  vlan-private:
    external: true
    name: br0
  voice: # private bridge to the TTS engines (Wyoming TTS proxies, stacks/chat.yaml)
    name: voice

# Local AI backends: Ollama (HA voice agent, AI Task, chat) and speech engines (HA voice pipelines, chat).
# GPU: RTX PRO 4000 Blackwell SFF (24 GB) via the Unraid "Nvidia Driver" plugin (open-source
# kernel module required for Blackwell), which provides the nvidia runtime.
# HA integrations:
#   Wyoming: whisper 192.168.1.50:10300 (STT), tts-chatterbox 192.168.1.51:10300, tts-kokoro 192.168.1.53:10300
#   Ollama:  http://192.168.1.52:11434 (conversation agent, thinking off + AI Task agent, thinking on)
# VRAM budget (~24 GB): Ollama model + Whisper + Chatterbox on GPU; Kokoro runs on CPU for comparison.
services:
  # Speech-to-text (Wyoming) on the GPU
  whisper:
    image: lscr.io/linuxserver/faster-whisper:gpu
    container_name: whisper
    restart: unless-stopped
    runtime: nvidia
    networks:
      vlan-private:
        ipv4_address: 192.168.1.50
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - WHISPER_MODEL=turbo # large-v3-turbo: near large-v3 accuracy, much faster
      - WHISPER_LANG=en
      - CUDA_CACHE_PATH=/config/cuda-cache # persist Blackwell JIT-compiled kernels across recreates
      - CUDA_CACHE_MAXSIZE=4294967296
    volumes:
      - /mnt/user/appdata/whisper:/config

  # Main voice: Chatterbox Turbo (350M, voice cloning, [laugh]-style tags) on the GPU.
  # Blackwell build (cu128). Default config already uses repo_id chatterbox-turbo and built-in voices.
  chatterbox:
    image: ghcr.io/devnen/chatterbox-tts-server:main-cu128
    container_name: chatterbox
    restart: unless-stopped
    runtime: nvidia
    networks:
      - voice
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_CACHE_PATH=/app/model_cache/cuda-cache # persist Blackwell JIT-compiled kernels across recreates
      - CUDA_CACHE_MAXSIZE=4294967296
      - TTS_BF16=auto # bf16 main model when supported (Blackwell): less VRAM, faster (default off = fp32, ~4.5 GB)
    volumes:
      # Don't mount /app/voices: it would hide the built-in voices shipped in the image.
      - /mnt/user/appdata/chatterbox/model_cache:/app/model_cache
      - /mnt/user/appdata/chatterbox/hf_cache:/app/hf_cache
      - /mnt/user/appdata/chatterbox/reference_audio:/app/reference_audio # clips for voice cloning

  tts-chatterbox:
    image: ghcr.io/roryeckel/wyoming_openai:latest
    container_name: tts-chatterbox
    restart: unless-stopped
    depends_on:
      - chatterbox
    networks:
      voice:
      vlan-private:
        ipv4_address: 192.168.1.51
    environment:
      - WYOMING_URI=tcp://0.0.0.0:10300
      - WYOMING_LANGUAGES=en
      - TTS_OPENAI_URL=http://chatterbox:8004/v1
      - TTS_MODELS=chatterbox-turbo
      # Chatterbox's OpenAI endpoint only accepts exact voice file names (built-ins, or clips added to
      # reference_audio for cloning); without this list the proxy falls back to OpenAI names (alloy...) -> 404.
      # Add cloned voice file names here too.
      - TTS_VOICES=Abigail.wav Adrian.wav Alexander.wav Alice.wav Austin.wav Axel.wav Connor.wav Cora.wav Elena.wav Eli.wav Emily.wav Everett.wav Gabriel.wav Gianna.wav Henry.wav Ian.wav Jade.wav Jeremiah.wav Jordan.wav Julian.wav Layla.wav Leonardo.wav Michael.wav Miles.wav Olivia.wav Ryan.wav Taylor.wav Thomas.wav
      - TTS_STREAMING_MODELS=chatterbox-turbo # sentence-by-sentence, first sentence plays while the rest renders

  # Comparison / fallback voice: Kokoro on CPU (costs no VRAM). Move to the GPU image if it wins.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    restart: unless-stopped
    networks:
      - voice

  tts-kokoro:
    image: ghcr.io/roryeckel/wyoming_openai:latest
    container_name: tts-kokoro
    restart: unless-stopped
    depends_on:
      - kokoro
    networks:
      voice:
      vlan-private:
        ipv4_address: 192.168.1.53
    environment:
      - WYOMING_URI=tcp://0.0.0.0:10300
      - WYOMING_LANGUAGES=en
      - TTS_OPENAI_URL=http://kokoro:8880/v1
      - TTS_BACKEND=KOKORO_FASTAPI
      - TTS_MODELS=kokoro
      - TTS_STREAMING_MODELS=kokoro

  # Local LLM: HA conversation agent (thinking off) + AI Task agent (thinking on), one resident model.
  # Unauthenticated API: br0 only. Model: gemma4:26b-nvfp4 (pull after first start).
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    runtime: nvidia
    networks:
      vlan-private:
        ipv4_address: 192.168.1.52
    environment:
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OLLAMA_KEEP_ALIVE=24h # keep the model in VRAM so voice replies don't wait on a reload
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0 # ~half the context-cache VRAM of f16, negligible quality loss (Ollama FAQ)
      # First request after a (re)create was ~0.7 tok/s while CUDA JIT-compiled kernels for Blackwell;
      # persisting the cache keeps later restarts/updates fast (~117 tok/s warm).
      - CUDA_CACHE_PATH=/root/.ollama/cuda-cache
      - CUDA_CACHE_MAXSIZE=4294967296
    volumes:
      - /mnt/user/appdata/ollama:/root/.ollama
