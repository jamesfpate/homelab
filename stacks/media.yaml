networks:
  vlan-private:
    external: true
    name: br0
  vlan-downloads:
    external: true

services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    privileged: true
    networks:
      vlan-private:
        ipv4_address: 192.168.1.10
      vlan-downloads: 
        ipv4_address: 192.168.60.10
    ports:
      - "1900:1900/udp"    # DLNA discovery
      - "3005:3005"        # Plex Companion (Mobile apps)
      - "5353:5353/udp"    # Bonjour/Avahi discovery
      - "8324:8324"        # Roku via UPNP
      - "32400:32400"      # Primary communication/Web interface
      - "32410:32410/udp"  # GDM network discovery
      - "32412:32412/udp"  # GDM network discovery
      - "32413:32413/udp"  # GDM network discovery
      - "32414:32414/udp"  # GDM network discovery
      - "32469:32469"      # DLNA media transfer
    devices:
      - /dev/dri:/dev/dri  # For Intel QuickSync/Graphics
    volumes:
      - /mnt/user/appdata/plex:/config
      - /mnt/user/plexmedia/movies:/movies
      - /mnt/user/plexmedia/tv:/tv
      - /mnt/user/plexmedia/anime:/anime
      - /mnt/user/plexmedia/kids-movies:/kids-movies
      - /mnt/user/plexmedia/kids-tv:/kids-tv
      - /mnt/user/plexmedia/kids-youtube:/kids-youtube
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - DOMAIN=${DOMAIN}
      - PLEX_CLAIM=${PLEX_CLAIM}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=br0"
      - "traefik.http.routers.plex.rule=Host(`plex.${DOMAIN}`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      #- "traefik.http.routers.plex.middlewares=ipallowlist"
      - "traefik.http.services.plex.loadbalancer.passHostHeader=true"
      - "traefik.http.services.plex.loadbalancer.server.scheme=http"

  prowlarr: #indexer
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.61  
    ports:
      - "9696:9696"  # Prowlarr web interface
    volumes:
      - /mnt/user/appdata/prowlarr:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`indexer.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.middlewares=ipallowlist" # no app login (External); LAN + VPN only
      - "traefik.http.services.prowlarr.loadbalancer.passHostHeader=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.scheme=http"

  sonarr: #tv
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.62
    ports:
      - "8989:8989"  # Sonarr web interface
    volumes:
      - /mnt/user/appdata/sonarr:/config
      - /mnt/user/plexmedia/tv:/tv
      - /mnt/user/plexmedia/anime:/anime
      - /mnt/user/plexmedia/kids-tv:/kids-tv
      - /mnt/user/downloads/usenet:/downloads/usenet
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`tv.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.middlewares=ipallowlist" # no app login (External); LAN + VPN only
      - "traefik.http.services.sonarr.loadbalancer.passHostHeader=true"
      - "traefik.http.services.sonarr.loadbalancer.server.scheme=http"

  radarr: #movies
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.63
    ports:
      - "7878:7878"  # Radarr web interface
    volumes:
      - /mnt/user/appdata/radarr:/config
      - /mnt/user/plexmedia/movies:/movies
      - /mnt/user/plexmedia/kids-movies:/kids-movies
      - /mnt/user/downloads/usenet:/downloads/usenet
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`movies.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.middlewares=ipallowlist" # no app login (External); LAN + VPN only
      - "traefik.http.services.radarr.loadbalancer.passHostHeader=true"
      - "traefik.http.services.radarr.loadbalancer.server.scheme=http"

  bazarr: #subtitles
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.64
    ports:
      - "6767:6767" #web interface
    volumes:
      - /mnt/user/appdata/bazarr:/config
      - /mnt/user/plexmedia/tv:/tv
      - /mnt/user/plexmedia/movies:/movies
      - /mnt/user/plexmedia/kids-tv:/kids-tv
      - /mnt/user/plexmedia/kids-movies:/kids-movies
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`subtitles.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr.middlewares=ipallowlist" # no app login (External); LAN + VPN only
      - "traefik.http.services.bazarr.loadbalancer.passHostHeader=true"
      - "traefik.http.services.bazarr.loadbalancer.server.scheme=http"
  
  seerr: #requests (successor to the archived Overseerr; migrated its config in place)
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true # required by Seerr (no built-in init process)
    restart: unless-stopped
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.65 # Cloudflare tunnel route request.<domain> points here
    volumes:
      # Old Overseerr folder, reused. Seerr runs as uid 1000: chown -R 1000:1000 before first start.
      - /mnt/user/appdata/overseerr:/app/config
    environment:
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`request.${DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
  
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    networks:
      #vlan-private:
      #  ipv4_address: 192.168.1.66
      vlan-downloads:
        ipv4_address: 192.168.60.66
    ports:
      - 8080:8080
    volumes:
      - /mnt/user/appdata/sabnzbd:/config
      - /mnt/user/downloads/usenet:/downloads/usenet
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`usenet.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
      - "traefik.http.routers.sabnzbd.middlewares=ipallowlist" # no app login (External); LAN + VPN only
      - "traefik.http.services.sabnzbd.loadbalancer.passHostHeader=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.scheme=http"
  
  lidarr: #music albums (Usenet via Prowlarr + sabnzbd; Soulseek via Tubifarry plugin in phase 2)
    # Nightly is required for plugins (Tubifarry). Pinned so the 03:00 auto-update can't pull untested nightlies.
    image: lscr.io/linuxserver/lidarr:nightly-3.1.6.5078-ls218
    container_name: lidarr
    restart: unless-stopped
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.68
    volumes:
      - /mnt/user/appdata/lidarr:/config
      - /mnt/user/plexmedia/music/library:/music/library # root folder; never the inbox
      - /mnt/user/downloads/usenet:/downloads/usenet
      - /mnt/user/downloads/slskd:/downloads/slskd # Tubifarry (phase 2)
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`albums.${DOMAIN}`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "traefik.http.routers.lidarr.middlewares=ipallowlist" # no app login (External); LAN + VPN only
      - "traefik.http.services.lidarr.loadbalancer.passHostHeader=true"
      - "traefik.http.services.lidarr.loadbalancer.server.scheme=http"

  gluetun: #VPN for slskd only (phase 2): AirVPN WireGuard device "slskd" with a forwarded port
    # The UDM "downloads-to-airvpn" route stays paused: it can't pass an inbound port to slskd.
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.69 # slskd API/UI is reached here (shares this network namespace)
    volumes:
      - /mnt/user/appdata/gluetun:/gluetun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${AIRVPN_SLSKD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${AIRVPN_SLSKD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${AIRVPN_SLSKD_ADDRESS} # IPv4 only
      - SERVER_COUNTRIES=Switzerland
      - FIREWALL_VPN_INPUT_PORTS=${AIRVPN_SLSKD_PORT} # AirVPN forwarded port -> Soulseek listen port
      - FIREWALL_INPUT_PORTS=5030 # slskd web/API from the LAN (Traefik, musicflow, Lidarr)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vlan-downloads"
      - "traefik.http.routers.slskd.rule=Host(`soulseek.${DOMAIN}`)"
      - "traefik.http.routers.slskd.entrypoints=websecure"
      - "traefik.http.routers.slskd.middlewares=ipallowlist"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"

  slskd: #Soulseek client (phase 2), all traffic through gluetun
    image: slskd/slskd:0.26.0
    container_name: slskd
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - /mnt/user/appdata/slskd:/app
      - /mnt/user/downloads/slskd:/app/downloads
      - /mnt/user/plexmedia/music/library:/music/library:ro # shared back to the network (peers block leechers)
    environment:
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD}
      - SLSKD_SLSK_LISTEN_PORT=${AIRVPN_SLSKD_PORT}
      - SLSKD_NO_AUTH=true # LAN-only behind Traefik's ipallowlist; no web login
      - SLSKD_USERNAME=${SLSKD_WEB_USER}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_DOWNLOADS_DIR=/app/downloads
      - SLSKD_SHARED_DIR=/music/library

  pinchflat: #youtube (curated playlists -> kids-youtube Plex library)
    image: ghcr.io/kieraneglin/pinchflat:latest
    container_name: pinchflat
    restart: unless-stopped
    user: "${PUID}:${PGID}" # not recommended to run as root; host dirs must be owned by this uid
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.67
    ports:
      - "8945:8945"  # Pinchflat web interface
    volumes:
      - /mnt/user/appdata/pinchflat:/config
      - /mnt/user/plexmedia/kids-youtube:/downloads
    environment:
      - TZ=${TZ}
      - UMASK=000 # Unraid-friendly perms on downloaded files
      - LOG_LEVEL=info
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pinchflat.rule=Host(`youtube.${DOMAIN}`)"
      - "traefik.http.routers.pinchflat.entrypoints=websecure"
      - "traefik.http.routers.pinchflat.middlewares=ipallowlist"
      - "traefik.http.services.pinchflat.loadbalancer.server.port=8945"
      - "traefik.http.services.pinchflat.loadbalancer.passHostHeader=true"
      - "traefik.http.services.pinchflat.loadbalancer.server.scheme=http"

