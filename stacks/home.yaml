networks:
  vlan-private:
    external: true
    name: br0
  vlan-iot:
    external: true

# mta-trains is built from apps/mta. Komodo's "Deploy on push" only redeploys a stack whose compose file changed, so after
# changing apps/mta bump x-app-version in the same commit.
x-app-version: 0025991
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    privileged: true
    networks:
      vlan-private:
        ipv4_address: 192.168.1.40
      vlan-iot:
        ipv4_address: 192.168.40.40
    ports:
      - "8123:8123"
    volumes:
      - /mnt/user/appdata/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      #- /dev/ttyACM0:/dev/ttyACM0 # Zooz 800 Z-Wave
    environment:
      - TZ=${TZ}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY} # animal sound clips (appdata/homeassistant/animal_sounds/fetch.py)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=br0" # must match HA trusted proxy 192.168.1.2
      - "traefik.http.routers.homeassistant.rule=Host(`ha.${DOMAIN}`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
      #- "traefik.http.routers.homeassistant.middlewares=ipallowlist"
      - "traefik.http.services.homeassistant.loadbalancer.passHostHeader=true"
      - "traefik.http.services.homeassistant.loadbalancer.server.scheme=http"
    restart: unless-stopped

  mosquitto: # MQTT broker for Home Assistant <-> AWTRIX (Ulanzi clock on the IoT VLAN). Both VLANs: HA talks to
    # 192.168.1.31, the clock to 192.168.40.31. Users come from MQTT_USER/MQTT_PASS in .env (password file is
    # regenerated at every start). HA: Settings > Integrations > MQTT > broker 192.168.1.31. Config: appdata/mosquitto.
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.31
      vlan-iot:
        ipv4_address: 192.168.40.31
    volumes:
      - /mnt/user/appdata/mosquitto/config:/mosquitto/config
      - /mnt/user/appdata/mosquitto/data:/mosquitto/data
    environment:
      - TZ=${TZ}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASS"
        chown mosquitto:mosquitto /mosquitto/config/passwd && chmod 600 /mosquitto/config/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf

  mta-trains: # next Manhattan-bound Q trains at Beverley Rd -> MQTT (transit/beverley_q_manhattan), for the office clock
    build: ../apps/mta
    image: mta-trains:local
    pull_policy: build
    container_name: mta-trains
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.32
    environment:
      - TZ=${TZ}
      - FEED=nqrw
      - ROUTE=Q
      - STOP_ID=D27N # Beverley Rd, northbound (Manhattan-bound); Brighton line stop ids D24-D29 = Prospect Park..Newkirk
      - TOPIC=transit/beverley_q_manhattan
      - POLL_S=30
      - MQTT_HOST=192.168.1.31
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}

  mta-trains-f: # next F trains at Church Av (Manhattan-bound) -> MQTT (transit/church_f_north)
    build: ../apps/mta
    image: mta-trains:local
    pull_policy: build
    container_name: mta-trains-f
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.33
    environment:
      - TZ=${TZ}
      - FEED=bdfm
      - ROUTE=F
      - STOP_ID=F27N # Church Av (F/G), northbound
      - TOPIC=transit/church_f_north
      - POLL_S=30
      - MQTT_HOST=192.168.1.31
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
