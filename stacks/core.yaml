networks:
  vlan-private:
    external: true
    name: br0
  vlan-downloads:
    external: true

# gatus is built from apps/gatus. Komodo's "Deploy on push" only redeploys a stack whose compose file changed, so after
# changing apps/gatus bump x-app-version in the same commit.
x-app-version: 4

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.11
    ports:
      - "80:80"
    environment:
      - TZ=${TZ}
      - PGADMIN_DEFAULT_EMAIL=${EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PG_PASS}
    volumes:
      - /mnt/user/appdata/pgadmin:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.db.rule=Host(`db.${DOMAIN}`)"
      - "traefik.http.routers.db.entrypoints=websecure"
      - "traefik.http.services.db.loadbalancer.server.port=80"
      #- "traefik.http.routers.db.middlewares=ipallowlist"
      - "traefik.http.services.db.loadbalancer.passHostHeader=true"
      - "traefik.http.services.db.loadbalancer.server.scheme=http"

  # Keeps the UDM WireGuard VPN endpoint hostname (DNS-only record) pointed at the home IP.
  # Not needed for the Cloudflare tunnel; only for things reached directly on the WAN IP.
  dyndns:
    image: qmcgaw/ddns-updater
    container_name: dyndns
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - PERIOD=5m
      - DOMAIN=${DOMAIN}
      # Whole config as one JSON line (takes precedence over /updater/data/config.json).
      # wg.<domain> is the UDM WireGuard endpoint: DNS only (proxied=false), IPv4 only.
      - 'CONFIG={"settings":[{"provider":"cloudflare","zone_identifier":"${CF_ZONE_ID}","domain":"wg.${DOMAIN}","ttl":1,"token":"${CF_DNS_API_TOKEN}","proxied":false,"ip_version":"ipv4"}]}'
      - SHOUTRRR_ADDRESSES=pushover://shoutrrr:${PUSHOVER_TOKEN}@${PUSHOVER_USER}
    networks:
      vlan-private:
        ipv4_address: 192.168.1.4
    ports:
      - "8000:8000"  # DDNS dashboard
    volumes:
      - /mnt/user/appdata/dyndns:/updater/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dyndns.rule=Host(`dyndns.${DOMAIN}`)"
      - "traefik.http.routers.dyndns.entrypoints=websecure"
      - "traefik.http.services.dyndns.loadbalancer.server.port=8000"
      #- "traefik.http.routers.dyndns.middlewares=ipallowlist"
      - "traefik.http.services.dyndns.loadbalancer.passHostHeader=true"
      - "traefik.http.services.dyndns.loadbalancer.server.scheme=http"
    
  postgres:
    image: postgres:18-trixie # pin major + Debian base: a major bump needs dump/restore, a base change needs a REINDEX
    container_name: postgres
    networks:
      vlan-private:
        ipv4_address: 192.168.1.13
    ports:
      - "5432:5432"  # For debugging/backup purposes
    volumes:
      - /mnt/user/appdata/postgres/db:/var/lib/postgresql # 18+ layout (data in 18/docker); old 17 data left in postgres/data
      - /mnt/user/appdata/postgres/backups:/backups
      - /mnt/user/appdata/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"  # Database doesn't need HTTP access
    restart: unless-stopped

  # Pocket ID: passkey-only OIDC login (id.<domain>). First run: open https://id.<domain>/setup and register a passkey
  # (that account is the admin). Clients so far: Immich (stacks/photos.yaml).
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2 # tracks v2.x
    container_name: pocket-id
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.21
    environment:
      - TZ=${TZ}
      - APP_URL=https://id.${DOMAIN}
      - TRUST_PROXY=true
      - ENCRYPTION_KEY=${POCKET_ID_ENCRYPTION_KEY}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /mnt/user/appdata/pocket-id:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocket-id.rule=Host(`id.${DOMAIN}`)"
      - "traefik.http.routers.pocket-id.entrypoints=websecure"
      - "traefik.http.routers.pocket-id.middlewares=ipallowlist"
      - "traefik.http.services.pocket-id.loadbalancer.server.port=1411"

  # Tailscale subnet router: remote access to the main LAN (192.168.1.0/24) from phones, no inbound ports.
  # Its own LAN IP because Unraid itself can't reach macvlan containers (so the Unraid Tailscale plugin can't
  # reach Traefik). Traffic is SNATed to 192.168.1.22, which the Traefik ipallowlist already allows.
  # First start: `docker logs tailscale` prints a login URL. Then in the admin console approve the subnet route
  # and disable key expiry for this machine.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: homelab
    restart: unless-stopped
    networks:
      vlan-private:
        ipv4_address: 192.168.1.22
    environment:
      - TS_HOSTNAME=homelab
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=192.168.1.0/24
      - TS_ACCEPT_DNS=false
    volumes:
      - /mnt/user/appdata/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    labels:
      - "traefik.enable=false"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # Internet-facing: only on the downloads VLAN, next to the one public app (Seerr).
    # Tunnel public hostname should point directly at Seerr http://192.168.60.65:5055, not Traefik.
    networks:
      vlan-downloads:
        ipv4_address: 192.168.60.3
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    labels:
      - "traefik.enable=false"

  # Uptime checks (apps/gatus/config.yaml) with Pushover alerts. Web UI at status.<domain>.
  gatus:
    build: ../apps/gatus
    image: gatus:local
    pull_policy: build
    container_name: gatus
    restart: unless-stopped
    cap_add:
      - NET_RAW # icmp checks
    networks:
      vlan-private:
        ipv4_address: 192.168.1.7
    environment:
      - TZ=${TZ}
      - DOMAIN=${DOMAIN}
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
    volumes:
      - /mnt/user/appdata/gatus:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.status.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.status.entrypoints=websecure"
      - "traefik.http.routers.status.middlewares=ipallowlist"
      - "traefik.http.services.status.loadbalancer.server.port=8080"
