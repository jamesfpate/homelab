## Komodo Resource Sync
## Create a Resource Sync in the Komodo UI named "homelab", pointing at this repo
## with resource path `komodo/resources.toml`. The "Deploy on push" procedure below
## re-runs it on a schedule, so edits to this file apply themselves.
## Schema: https://komo.do/docs/automate/sync-resources
##
## Updates are hands-off:
## - Compose file changes pushed to main deploy within ~5 min ("Deploy on push").
## - New images for each stack's tags are pulled + redeployed daily at 03:00 by the
##   "Global Auto Update" procedure below (auto_update = true on each stack). It's declared
##   here because Komodo only creates its default procedures on a brand-new install.
## Version pinning lives in the compose files' image tags (e.g. postgres:17), not here.
##
## project_name must match the compose project name each stack is currently running
## under so Komodo adopts the running containers instead of colliding with them.

[[stack]]
name = "proxy"
tags = ["homelab"]
[stack.config]
server = "Unraid"
project_name = "proxy"
repo = "jamesfpate/homelab"
branch = "main"
file_paths = ["stacks/proxy.yaml"]
additional_env_files = [{ path = "/mnt/user/appdata/env/.env", track = false }]
auto_update = true

[[stack]]
name = "core"
tags = ["homelab"]
[stack.config]
server = "Unraid"
project_name = "core"
repo = "jamesfpate/homelab"
branch = "main"
file_paths = ["stacks/core.yaml"]
additional_env_files = [{ path = "/mnt/user/appdata/env/.env", track = false }]
auto_update = true

[[stack]]
name = "home"
tags = ["homelab"]
[stack.config]
server = "Unraid"
project_name = "home"
repo = "jamesfpate/homelab"
branch = "main"
file_paths = ["stacks/home.yaml"]
additional_env_files = [{ path = "/mnt/user/appdata/env/.env", track = false }]
auto_update = true

[[stack]]
name = "media"
tags = ["homelab"]
[stack.config]
server = "Unraid"
project_name = "media"
repo = "jamesfpate/homelab"
branch = "main"
file_paths = ["stacks/media.yaml"]
additional_env_files = [{ path = "/mnt/user/appdata/env/.env", track = false }]
auto_update = true

[[procedure]]
name = "Deploy on push"
description = "Apply this sync, then redeploy any stack whose compose files changed on main."
tags = ["homelab"]
[procedure.config]
schedule_format = "Cron"
schedule = "0 */5 * * * *" # sec min hour day month weekday: every 5 minutes
## Off until every stack has been deployed once by hand from Komodo: a stack Komodo has never
## deployed counts as "changed", so enabling this first would redeploy everything at once.
## Flip to true, push, then run the "homelab" sync manually once.
schedule_enabled = false
failure_alert = true

[[procedure.config.stage]]
name = "Sync resources"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab" },
]

[[procedure.config.stage]]
name = "Deploy changed stacks"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*" },
]

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks using 'poll_for_updates' or 'auto_update'."
tags = ["homelab"]
[procedure.config]
schedule = "Every day at 03:00"
failure_alert = true

[[procedure.config.stage]]
name = "Stage 1"
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false },
]
