[[procedure]]
name = "Deploy on push"
description = "Apply this sync, then redeploy any stack whose compose files changed on main."
tags = ["homelab"]
[procedure.config]
schedule_format = "Cron"
schedule = "0 */5 * * * *" # sec min hour day month weekday: every 5 minutes
failure_alert = true

[[procedure.config.stage]]
name = "Sync resources"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab" },
]

[[procedure.config.stage]]
name = "Deploy changed stacks"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*" },
]
