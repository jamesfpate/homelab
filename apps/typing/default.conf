server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    # Always revalidate so a redeploy shows up on the next load instead of a heuristically cached page.
    add_header Cache-Control "no-cache";

    # Speech: same-origin proxy to Chatterbox (ai stack, "voice" network). Resolved at request time so nginx
    # still starts when Chatterbox is down; the page falls back to the browser voice on errors.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $chatterbox http://chatterbox:8004;
    location /tts/ {
        rewrite ^/tts/(.*)$ /$1 break;
        proxy_pass $chatterbox;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
